name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows ${{ matrix.qt.label }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        qt:
          - label: Qt 5.15.2
            version: 5.15.2
            arch: win64_msvc2019_64
            config: Debug
            shared: "OFF"
            tests: "ON"
          - label: Qt 6.7.3
            version: 6.7.3
            arch: win64_msvc2019_64
            config: Debug
            shared: "OFF"
            tests: "ON"
          - label: Qt 6.7.3 shared Release
            version: 6.7.3
            arch: win64_msvc2019_64
            config: Release
            shared: "ON"
            tests: "ON"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ matrix.qt.version }}
          arch: ${{ matrix.qt.arch }}
          cache: true

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DQT_MD3_BUILD_EXAMPLES=ON
          -DQT_MD3_BUILD_TESTS=${{ matrix.qt.tests }}
          -DBUILD_SHARED_LIBS=${{ matrix.qt.shared }}
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\install"

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ matrix.qt.config }} --parallel

      - name: Install
        shell: pwsh
        run: cmake --install build --config ${{ matrix.qt.config }}

      - name: Run installed example smoke
        shell: pwsh
        run: |
          & "${{ github.workspace }}\install\bin\qt-md3-example.exe" --smoke-exit-ms 800
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: pwsh
        run: |
          # Shared Qt builds resolve Qt DLLs at load time; the runner's PATH
          # does not include the Qt bin directory, which made every test
          # executable die with STATUS_DLL_NOT_FOUND (0xc0000135).
          if ($env:QT_ROOT_DIR) { $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH" }
          ctest --test-dir build -C ${{ matrix.qt.config }} --output-on-failure --timeout 180

  linux:
    name: Linux ${{ matrix.qt.label }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        qt:
          # The Linux aqt repository currently lacks qt_base metadata for the
          # tested Qt6 releases, so Qt6 remains covered on Windows/macOS.
          - label: Qt 5.15.2 Debug ASan+UBSan
            version: 5.15.2
            config: Debug
            shared: "OFF"
            tests: "ON"
            asan: "ON"
            ubsan: "ON"
          - label: Qt 5.15.2 shared Release
            version: 5.15.2
            config: Release
            shared: "ON"
            tests: "ON"
            asan: "OFF"
            ubsan: "OFF"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ matrix.qt.version }}
          arch: gcc_64
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.qt.config }}
          -DQT_MD3_BUILD_EXAMPLES=OFF
          -DQT_MD3_BUILD_TESTS=${{ matrix.qt.tests }}
          -DQT_MD3_ENABLE_ADDRESS_SANITIZER=${{ matrix.qt.asan }}
          -DQT_MD3_ENABLE_UNDEFINED_SANITIZER=${{ matrix.qt.ubsan }}
          -DBUILD_SHARED_LIBS=${{ matrix.qt.shared }}
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests
        env:
          # Qt/platform plugins retain process-lifetime caches; focus this job on
          # address/UB violations in project code instead of third-party LSAN noise.
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 180

      - name: Install library
        if: matrix.qt.asan == 'OFF' && matrix.qt.ubsan == 'OFF'
        run: cmake --install build

  macos:
    name: macOS Qt 6 shared Release
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.7.3
          arch: clang_64
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQT_MD3_BUILD_EXAMPLES=OFF
          -DQT_MD3_BUILD_TESTS=OFF
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Build and install library
        run: cmake --build build --parallel 2 && cmake --install build
